    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=David+Libre:wght@400;700&family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: black; color: #e7e5e4; margin: 0; overflow-x: hidden; }
        .font-serif { font-family: 'David Libre', serif; }
        .song-text { font-family: 'Noto Serif Hebrew', 'David Libre', serif; line-height: 1.95; color: #d6d3d1; }
        .song-line { margin: 0 0 0.3em; }
        .song-h { font-family: 'David Libre', serif; font-weight: 700; color: #fff; font-size: 1.2em; margin: 0 0 0.35em; }
        .song-block { padding: 1.1em 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .song-block { display: flow-root; }
        .song-sketch { float: left; width: 5.5rem; height: 5.5rem; margin: 0.2rem 1rem 0.5rem 0; opacity: 0.92; pointer-events: none; user-select: none; }
        @media (min-width: 768px) { .song-sketch { width: 7rem; height: 7rem; margin-left: 0.5rem; } }
        .song-source { font-family: 'Assistant', sans-serif; font-size: 0.7em; color: #78716c; white-space: nowrap; }
        .song-anchor { scroll-margin-top: 7rem; }
        .song-closing { text-align: center; padding-top: 2em; color: #e7e5e4; }
        .song-share { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.4em; font-family: 'Assistant', sans-serif; font-size: 0.85rem; color: #78716c; }
        .song-share:hover { color: #e7e5e4; }
        /* מפת הגוף */
        .body-map .map-dot { cursor: pointer; }
        .map-dot-off { fill: #e7e5e4; filter: drop-shadow(0 0 4px rgba(255,255,255,0.9)); animation: dotGlow 3.2s ease-in-out infinite; animation-delay: inherit; }
        .map-dot-on { fill: #fff; filter: drop-shadow(0 0 8px #fff); }
        .body-map .map-dot:hover .map-dot-off, .body-map .map-dot:focus .map-dot-off { fill: #fff; }
        @keyframes dotGlow { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
        /* תנועה עדינה: לב פועם, ריאות נושמות, לוגו נושם */
        .anim-pulse { animation: sketchPulse 3.4s ease-in-out infinite; transform-origin: center; }
        .anim-breathe { animation: sketchBreathe 6s ease-in-out infinite; transform-origin: center; }
        .anim-breathe-slow { animation: sketchBreathe 9s ease-in-out infinite; }
        @keyframes sketchPulse { 0%, 30%, 100% { transform: scale(1); } 10% { transform: scale(1.045); } 20% { transform: scale(1.015); } }
        @keyframes sketchBreathe { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.05); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .anim-pulse, .anim-breathe, .anim-breathe-slow, .map-dot-off { animation: none !important; } }
        /* ניגודיות גבוהה */
        .hc body { color: #fff; }
        .hc .song-text, .hc .song-closing { color: #fff; }
        .hc .song-source, .hc .song-share { color: #e7e5e4; }
        .hc .song-block { border-bottom-color: rgba(255,255,255,0.3); }
        .hc .text-stone-300, .hc .text-stone-400, .hc .text-stone-500, .hc .text-stone-600 { color: #f5f5f4 !important; }
        .hc .song-sketch { opacity: 1; }
        /* הדפסה */
        @media print {
            @page { margin: 16mm 14mm; }
            html, body { background: #fff !important; }
            * { color: #000 !important; background: transparent !important; box-shadow: none !important; text-shadow: none !important; }
            nav, footer, button, .no-print, .fixed { display: none !important; }
            main { padding-top: 0 !important; }
            .song-text { font-size: 13pt !important; line-height: 1.8; }
            .song-block { break-inside: avoid; border-bottom: 1px solid #ccc !important; }
            .song-sketch { filter: invert(1); opacity: 1 !important; width: 22mm !important; height: 22mm !important; animation: none !important; }
            .song-source { color: #555 !important; }
            a { text-decoration: none !important; }
            .sticky { position: static !important; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1c1917; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .book-container {
            height: calc(100vh - 9rem); 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0,0,0,0.95);
        }

        i[data-lucide] {
            display: inline-block;
            vertical-align: middle;
            line-height: 1;
        }
    </style>
